<!-- React + Babel (CDN) -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ================= DATA MASTER (ubah nama siswa di sini) ================= */
const SCHOOL = 'SMK Bagimu Negeriku';
const KELAS = '11 RPL';
const CLASSES = {
  [KELAS]: ['Alfaro', 'Andhika', 'Aril', 'David', 'Ryan', 'Gelsen', 'Gio', 'Jeje', 'Melvin', 'Marsel', 'Mutiara', 'Tito', 'Santiago', 'Stephen', 'Vines', 'Vinzent', 'Yohanis', 'Yokhanan'],
};
const SUBJECTS = ['Matematika', 'Bahasa Indonesia', 'Bahasa Inggris', 'IPA', 'IPS', 'PPKn', 'Pemrograman Web', 'Basis Data', 'PBO', 'Informatika', 'Seni Budaya'];
const STATUS = ['Hadir', 'Sakit', 'Izin', 'Alpha'];

/* ================= HELPER ================= */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
// Menghitung total tiap status absensi dari kumpulan jurnal.
const tally = (list) => list.reduce((acc, j) => { Object.values(j.absensi).forEach((s) => (acc[s] += 1)); return acc; }, { Hadir: 0, Sakit: 0, Izin: 0, Alpha: 0 });

// Simulasi unduh: membuat file di browser lalu memicu download.
function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  Object.assign(document.createElement('a'), { href: url, download: name }).click();
  URL.revokeObjectURL(url);
}
const exportJSON = (rows) => download('jurnal-kelas.json', JSON.stringify(rows, null, 2), 'application/json');
function exportCSV(rows) {
  const head = ['Tanggal', 'Kelas', 'Mata Pelajaran', 'Guru', 'Jam Ke', 'Materi', 'Catatan', 'Hadir', 'Sakit', 'Izin', 'Alpha'];
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const lines = rows.map((j) => {
    const c = tally([j]);
    return [j.tanggal, j.kelas, j.mapel, j.guru, j.jam, j.materi, j.catatan, c.Hadir, c.Sakit, c.Izin, c.Alpha].map(q).join(',');
  });
  download('jurnal-kelas.csv', [head.map(q).join(','), ...lines].join('\n'), 'text/csv');
}

/* ================= HOOKS ================= */
// State yang otomatis tersimpan ke localStorage (bertahan saat refresh).
function useLocalStorage(key, initial) {
  const [value, setValue] = useState(() => {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : initial; } catch { return initial; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }, [key, value]);
  return [value, setValue];
}
// Menganimasikan angka dari 0 ke `target`.
function useCountUp(target, ms = 1000) {
  const [v, setV] = useState(0);
  useEffect(() => {
    let raf, start;
    const step = (t) => {
      if (start === undefined) start = t;
      const p = Math.min((t - start) / ms, 1);
      setV(Math.round(target * (1 - Math.pow(1 - p, 3))));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, ms]);
  return v;
}

/* ================= KOMPONEN UI REUSABLE ================= */
const VARIANTS = {
  primary: 'bg-indigo-600 text-white hover:bg-indigo-700',
  secondary: 'bg-white text-slate-700 border border-slate-300 hover:bg-slate-50',
  danger: 'bg-rose-600 text-white hover:bg-rose-700',
  ghost: 'text-slate-600 hover:bg-slate-100',
};
const Button = ({ variant = 'primary', className = '', ...p }) => (
  <button className={`inline-flex items-center justify-center gap-2 rounded-lg px-3.5 py-2 text-sm font-medium transition active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:opacity-50 ${VARIANTS[variant]} ${className}`} {...p} />
);
const Card = ({ className = '', children, ...p }) => (
  <div className={`animate-fade-up rounded-2xl border border-slate-200 bg-white p-5 shadow-sm ${className}`} {...p}>{children}</div>
);
const TONES = { Hadir: 'bg-emerald-100 text-emerald-700', Sakit: 'bg-amber-100 text-amber-700', Izin: 'bg-sky-100 text-sky-700', Alpha: 'bg-rose-100 text-rose-700', default: 'bg-indigo-100 text-indigo-700' };
const Badge = ({ tone = 'default', children }) => (
  <span className={`inline-block rounded-full px-2.5 py-0.5 text-xs font-medium ${TONES[tone]}`}>{children}</span>
);
// Input serbaguna: input, textarea, atau select (prop `as` dan `options`).
function Field({ label, as: As = 'input', options = [], className = '', ...p }) {
  const base = 'w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200';
  return (
    <label className={`block ${className}`}>
      <span className="mb-1 block text-sm font-medium text-slate-700">{label}</span>
      {As === 'select'
        ? <select className={base} {...p}>{options.map((o) => <option key={o}>{o}</option>)}</select>
        : <As className={base} {...p} />}
    </label>
  );
}
// Dialog modal; tutup dengan Esc atau klik latar.
function Modal({ open, title, onClose, children }) {
  useEffect(() => {
    const onKey = (e) => e.key === 'Escape' && onClose();
    if (open) window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4" onClick={onClose}>
      <div role="dialog" aria-modal="true" className="animate-fade-up w-full max-w-md rounded-2xl bg-white p-6 shadow-xl" onClick={(e) => e.stopPropagation()}>
        <h2 className="mb-3 text-lg font-bold text-slate-900">{title}</h2>
        {children}
      </div>
    </div>
  );
}

/* ================= DASHBOARD ================= */
const Num = ({ to, suffix = '' }) => { const v = useCountUp(to); return <>{v}{suffix}</>; };
const BAR = { Hadir: 'bg-emerald-500', Sakit: 'bg-amber-500', Izin: 'bg-sky-500', Alpha: 'bg-rose-500' };

function Dashboard({ journals, go }) {
  const [ready, setReady] = useState(false); // memicu transisi cincin & bar
  useEffect(() => { const t = setTimeout(() => setReady(true), 150); return () => clearTimeout(t); }, []);

  const d = useMemo(() => {
    const t = tally(journals);
    const total = Object.values(t).reduce((a, b) => a + b, 0);
    const today = new Date().toISOString().slice(0, 10);
    const miss = Object.fromEntries(CLASSES[KELAS].map((n) => [n, 0])); // ketidakhadiran per siswa
    journals.forEach((j) => Object.entries(j.absensi).forEach(([n, s]) => { if (s !== 'Hadir' && n in miss) miss[n] += 1; }));
    return {
      t, total,
      pct: total ? Math.round((t.Hadir / total) * 100) : 0,
      hariIni: journals.filter((j) => j.tanggal === today).length,
      perhatian: Object.entries(miss).filter(([, c]) => c > 0).sort((a, b) => b[1] - a[1]).slice(0, 4),
      recent: [...journals].sort((a, b) => b.tanggal.localeCompare(a.tanggal)).slice(0, 4),
    };
  }, [journals]);

  const kpis = [
    ['Total jurnal', journals.length, '', 'from-indigo-500 to-violet-500'],
    ['Jurnal hari ini', d.hariIni, '', 'from-sky-500 to-cyan-400'],
    ['Jumlah siswa', CLASSES[KELAS].length, '', 'from-fuchsia-500 to-pink-500'],
    ['Kehadiran', d.pct, '%', 'from-emerald-500 to-teal-400'],
  ];
  const delay = (i) => ({ animationDelay: `${i * 90}ms` });

  return (
    <div className="space-y-6">
      {/* Hero dengan gradien bergerak */}
      <div className="animate-aurora relative overflow-hidden rounded-3xl bg-gradient-to-r from-indigo-600 via-violet-600 to-sky-500 bg-[length:200%_200%] p-6 text-white shadow-lg shadow-indigo-500/20 md:p-9">
        <div className="animate-float absolute -right-10 -top-12 h-52 w-52 rounded-full bg-white/15 blur-2xl" />
        <div className="animate-float absolute bottom-[-4rem] right-1/3 h-40 w-40 rounded-full bg-sky-300/30 blur-2xl [animation-delay:2s]" />
        <p className="relative text-sm font-medium text-indigo-100">{SCHOOL}</p>
        <h2 className="relative mt-1 text-3xl font-extrabold tracking-tight md:text-4xl">Jurnal Kelas {KELAS}</h2>
        <p className="relative mt-2 text-sm text-indigo-100">{new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
        <div className="relative mt-6 flex flex-wrap gap-2">
          <button onClick={() => go('form')} className="rounded-xl bg-white px-4 py-2.5 text-sm font-semibold text-indigo-700 shadow transition hover:-translate-y-0.5 hover:shadow-lg active:scale-95">Tulis jurnal baru</button>
          <button onClick={() => go('riwayat')} className="rounded-xl bg-white/15 px-4 py-2.5 text-sm font-semibold backdrop-blur transition hover:bg-white/25 active:scale-95">Lihat riwayat</button>
        </div>
      </div>

      {/* KPI */}
      <div className="grid grid-cols-2 gap-4 lg:grid-cols-4">
        {kpis.map(([label, val, suf, grad], i) => (
          <Card key={label} style={delay(i + 1)} className="relative overflow-hidden transition hover:-translate-y-1 hover:shadow-lg">
            <div className={`absolute inset-x-0 top-0 h-1 bg-gradient-to-r ${grad}`} />
            <p className="text-sm text-slate-500">{label}</p>
            <p className="mt-2 text-3xl font-extrabold text-slate-900"><Num to={val} suffix={suf} /></p>
          </Card>
        ))}
      </div>

      <div className="grid gap-4 lg:grid-cols-5">
        {/* Cincin kehadiran + bar status */}
        <Card style={delay(5)} className="lg:col-span-3">
          <h3 className="mb-4 font-bold text-slate-900">Ringkasan absensi</h3>
          <div className="flex flex-col items-center gap-6 sm:flex-row">
            <div className="relative h-36 w-36 shrink-0">
              <svg viewBox="0 0 120 120" className="-rotate-90">
                <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0%" stopColor="#6366f1" /><stop offset="100%" stopColor="#10b981" /></linearGradient></defs>
                <circle cx="60" cy="60" r="50" fill="none" stroke="#e2e8f0" strokeWidth="12" />
                <circle cx="60" cy="60" r="50" fill="none" stroke="url(#g)" strokeWidth="12" strokeLinecap="round" pathLength="100"
                  strokeDasharray="100" strokeDashoffset={ready ? 100 - d.pct : 100} style={{ transition: 'stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)' }} />
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <span className="text-2xl font-extrabold text-slate-900"><Num to={d.pct} suffix="%" /></span>
                <span className="text-xs text-slate-500">hadir</span>
              </div>
            </div>
            <div className="w-full space-y-3">
              {Object.entries(d.t).map(([s, n]) => (
                <div key={s}>
                  <div className="mb-1 flex justify-between text-sm"><span className="font-medium text-slate-700">{s}</span><span className="text-slate-500">{n}</span></div>
                  <div className="h-2 overflow-hidden rounded-full bg-slate-100">
                    <div className={`h-full rounded-full ${BAR[s]}`} style={{ width: ready && d.total ? `${(n / d.total) * 100}%` : '0%', transition: 'width 1.2s cubic-bezier(.2,.8,.2,1)' }} />
                  </div>
                </div>
              ))}
            </div>
          </div>
        </Card>

        {/* Siswa perlu perhatian */}
        <Card style={delay(6)} className="lg:col-span-2">
          <h3 className="mb-3 font-bold text-slate-900">Perlu perhatian</h3>
          {d.perhatian.length === 0 ? (
            <p className="text-sm text-slate-500">Belum ada siswa yang tidak hadir. Kelas terlihat aman.</p>
          ) : (
            <ul className="space-y-2">
              {d.perhatian.map(([nama, c]) => (
                <li key={nama} className="flex items-center gap-3 rounded-xl bg-slate-50 p-2.5 transition hover:bg-indigo-50">
                  <span className="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-indigo-500 to-violet-500 text-sm font-bold text-white">{nama[0]}</span>
                  <span className="flex-1 text-sm font-medium text-slate-800">{nama}</span>
                  <Badge tone="Alpha">{c}x tidak hadir</Badge>
                </li>
              ))}
            </ul>
          )}
        </Card>
      </div>

      {/* Jurnal terbaru */}
      <Card style={delay(7)}>
        <h3 className="mb-3 font-bold text-slate-900">Jurnal terbaru</h3>
        {d.recent.length === 0 ? (
          <p className="text-sm text-slate-500">Belum ada jurnal. Klik "Tulis jurnal baru" untuk memulai.</p>
        ) : (
          <ul className="divide-y divide-slate-100">
            {d.recent.map((j) => (
              <li key={j.id} className="flex flex-wrap items-center justify-between gap-2 py-3 text-sm">
                <span className="font-semibold text-slate-800">{j.mapel}</span>
                <span className="text-slate-500">{fmtDate(j.tanggal)} · {j.guru}</span>
              </li>
            ))}
          </ul>
        )}
      </Card>
    </div>
  );
}

/* ================= FORM JURNAL + ABSENSI ================= */
const ACTIVE = { Hadir: 'bg-emerald-500 text-white', Sakit: 'bg-amber-500 text-white', Izin: 'bg-sky-500 text-white', Alpha: 'bg-rose-500 text-white' };
// Semua siswa kelas diberi status awal "Hadir".
const roster = (kelas) => Object.fromEntries(CLASSES[kelas].map((n) => [n, 'Hadir']));
const blank = () => ({ tanggal: new Date().toISOString().slice(0, 10), kelas: KELAS, mapel: SUBJECTS[0], guru: '', jam: '1', materi: '', catatan: '', absensi: roster(KELAS) });

// `initial` terisi saat mode edit.
function JournalForm({ initial, onSave, onCancel }) {
  const [f, setF] = useState(initial || blank());
  const set = (k) => (e) => setF({ ...f, [k]: e.target.value });
  const setStatus = (nama, s) => setF({ ...f, absensi: { ...f.absensi, [nama]: s } });
  const submit = (e) => { e.preventDefault(); onSave({ ...f, id: f.id || uid() }); };

  return (
    <form onSubmit={submit} className="space-y-6">
      <Card>
        <h2 className="mb-4 font-bold text-slate-900">{initial ? 'Edit jurnal' : 'Jurnal baru'}</h2>
        <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          <Field label="Tanggal" type="date" required value={f.tanggal} onChange={set('tanggal')} />
          <Field label="Kelas" as="select" options={Object.keys(CLASSES)} value={f.kelas} onChange={set('kelas')} />
          <Field label="Mata pelajaran" as="select" options={SUBJECTS} value={f.mapel} onChange={set('mapel')} />
          <Field label="Nama guru" required placeholder="Nama lengkap guru" value={f.guru} onChange={set('guru')} />
          <Field label="Jam ke-" placeholder="Contoh: 1-2" required value={f.jam} onChange={set('jam')} />
        </div>
        <div className="mt-4 grid gap-4">
          <Field label="Materi pembelajaran" as="textarea" rows="3" required value={f.materi} onChange={set('materi')} />
          <Field label="Catatan kelas" as="textarea" rows="2" value={f.catatan} onChange={set('catatan')} />
        </div>
      </Card>

      <Card>
        <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
          <h2 className="font-bold text-slate-900">Absensi siswa · {f.kelas}</h2>
          <Button type="button" variant="secondary" onClick={() => setF({ ...f, absensi: roster(f.kelas) })}>Semua hadir</Button>
        </div>
        <ul className="divide-y divide-slate-100">
          {Object.entries(f.absensi).map(([nama, s]) => (
            <li key={nama} className="flex flex-wrap items-center justify-between gap-2 py-2">
              <span className="text-sm text-slate-800">{nama}</span>
              <div className="flex gap-1" role="group" aria-label={`Status ${nama}`}>
                {STATUS.map((opt) => (
                  <button type="button" key={opt} onClick={() => setStatus(nama, opt)} aria-pressed={s === opt}
                    className={`rounded-md px-2.5 py-1 text-xs font-medium transition ${s === opt ? ACTIVE[opt] + ' scale-105 shadow' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{opt}</button>
                ))}
              </div>
            </li>
          ))}
        </ul>
      </Card>

      <div className="flex justify-end gap-2">
        <Button type="button" variant="ghost" onClick={onCancel}>Batal</Button>
        <Button type="submit">Simpan jurnal</Button>
      </div>
    </form>
  );
}

/* ================= RIWAYAT: cari, filter, edit, hapus, ekspor ================= */
function History({ journals, onEdit, onDelete }) {
  const [q, setQ] = useState('');
  const [mapel, setMapel] = useState('Semua');
  const [tanggal, setTanggal] = useState('');
  const [toDelete, setToDelete] = useState(null);

  const rows = useMemo(() => {
    const k = q.toLowerCase();
    return journals
      .filter((j) => (mapel === 'Semua' || j.mapel === mapel) && (!tanggal || j.tanggal === tanggal))
      .filter((j) => !k || [j.guru, j.materi, j.catatan, j.kelas].some((v) => v.toLowerCase().includes(k)))
      .sort((a, b) => b.tanggal.localeCompare(a.tanggal));
  }, [journals, q, mapel, tanggal]);

  return (
    <div className="space-y-4">
      <Card>
        <div className="grid gap-3 sm:grid-cols-3">
          <Field label="Cari" placeholder="Guru, materi, catatan…" value={q} onChange={(e) => setQ(e.target.value)} />
          <Field label="Mata pelajaran" as="select" options={['Semua', ...SUBJECTS]} value={mapel} onChange={(e) => setMapel(e.target.value)} />
          <Field label="Tanggal" type="date" value={tanggal} onChange={(e) => setTanggal(e.target.value)} />
        </div>
        <div className="mt-4 flex flex-wrap gap-2">
          <Button variant="secondary" disabled={!rows.length} onClick={() => exportCSV(rows)}>Unduh CSV</Button>
          <Button variant="secondary" disabled={!rows.length} onClick={() => exportJSON(rows)}>Unduh JSON</Button>
          <span className="ml-auto self-center text-sm text-slate-500">{rows.length} jurnal</span>
        </div>
      </Card>

      {rows.length === 0 ? (
        <Card><p className="text-sm text-slate-500">Tidak ada jurnal yang cocok. Ubah kata kunci atau filter.</p></Card>
      ) : (
        <div className="animate-fade-up overflow-x-auto rounded-2xl border border-slate-200 bg-white shadow-sm">
          <table className="min-w-full text-left text-sm">
            <thead className="bg-slate-50 text-slate-600">
              <tr>{['Tanggal', 'Kelas', 'Mapel', 'Guru', 'Jam', 'Materi', 'Absensi', 'Aksi'].map((h) => <th key={h} className="px-4 py-3 font-medium">{h}</th>)}</tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {rows.map((j) => {
                const t = tally([j]);
                return (
                  <tr key={j.id} className="align-top transition hover:bg-indigo-50/40">
                    <td className="whitespace-nowrap px-4 py-3">{fmtDate(j.tanggal)}</td>
                    <td className="px-4 py-3"><Badge>{j.kelas}</Badge></td>
                    <td className="px-4 py-3">{j.mapel}</td>
                    <td className="px-4 py-3">{j.guru}</td>
                    <td className="px-4 py-3">{j.jam}</td>
                    <td className="max-w-xs px-4 py-3 text-slate-600">{j.materi}</td>
                    <td className="whitespace-nowrap px-4 py-3 text-xs text-slate-600">H {t.Hadir} · S {t.Sakit} · I {t.Izin} · A {t.Alpha}</td>
                    <td className="whitespace-nowrap px-4 py-3">
                      <Button variant="ghost" onClick={() => onEdit(j)}>Edit</Button>
                      <Button variant="ghost" className="text-rose-600" onClick={() => setToDelete(j)}>Hapus</Button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      <Modal open={!!toDelete} title="Hapus jurnal?" onClose={() => setToDelete(null)}>
        <p className="text-sm text-slate-600">Jurnal {toDelete && toDelete.mapel} ({toDelete && fmtDate(toDelete.tanggal)}) akan dihapus permanen.</p>
        <div className="mt-5 flex justify-end gap-2">
          <Button variant="secondary" onClick={() => setToDelete(null)}>Batal</Button>
          <Button variant="danger" onClick={() => { onDelete(toDelete.id); setToDelete(null); }}>Hapus jurnal</Button>
        </div>
      </Modal>
    </div>
  );
}

function Logo() {
  return <img src={LOGO_SRC} alt="Logo SMK Bagimu Negeriku" className="h-11 w-11 rounded-full bg-white object-cover shadow-lg shadow-indigo-500/30 ring-2 ring-white/10" />;
}

function App() {
  const [journals, setJournals] = useLocalStorage('jurnal-kelas:v1', []);
  const [view, setView] = useState('dashboard');
  const [editing, setEditing] = useState(null);

  const go = (v) => { setEditing(null); setView(v); };
  const save = (j) => {
    setJournals((list) => (list.some((x) => x.id === j.id) ? list.map((x) => (x.id === j.id ? j : x)) : [j, ...list]));
    go('riwayat');
  };

  return (
    <div className="min-h-screen bg-slate-50 font-sans text-slate-900 md:flex">
      {/* Sidebar gelap (desktop) */}
      <aside className="hidden w-64 shrink-0 flex-col bg-slate-950 p-5 text-slate-300 md:flex">
        <div className="mb-8 flex items-center gap-3">
          <Logo />
          <div><p className="font-bold leading-tight text-white">Jurnal Kelas</p><p className="text-xs text-slate-400">{SCHOOL}</p></div>
        </div>
        <nav className="space-y-1">
          {NAV.map(([id, label]) => (
            <button key={id} onClick={() => go(id)} aria-current={view === id}
              className={`relative block w-full rounded-xl px-4 py-2.5 text-left text-sm font-medium transition ${view === id ? 'bg-white/10 text-white' : 'hover:bg-white/5 hover:text-white'}`}>
              {view === id && <span className="absolute left-0 top-2 h-6 w-1 rounded-r bg-indigo-400" />}
              {label}
            </button>
          ))}
        </nav>
        <div className="mt-auto rounded-xl bg-white/5 p-3 text-xs"><p className="text-slate-400">Kelas aktif</p><p className="text-base font-bold text-white">{KELAS}</p></div>
      </aside>

      <main className="flex-1 overflow-x-hidden p-4 pb-24 md:p-8">
        <h1 className="mb-5 text-2xl font-extrabold tracking-tight">{NAV.find(([id]) => id === view)[1]}</h1>
        {/* key membuat animasi masuk berulang tiap pindah halaman */}
        <div key={view + (editing ? editing.id : '')} className="animate-fade-up">
          {view === 'dashboard' && <Dashboard journals={journals} go={go} />}
          {view === 'form' && <JournalForm key={editing ? editing.id : 'new'} initial={editing} onSave={save} onCancel={() => go('riwayat')} />}
          {view === 'riwayat' && <History journals={journals} onEdit={(j) => { setEditing(j); setView('form'); }} onDelete={(id) => setJournals((l) => l.filter((x) => x.id !== id))} />}
        </div>
      </main>

      {/* Navigasi bawah (mobile) */}
      <nav className="fixed inset-x-0 bottom-0 grid grid-cols-3 border-t border-slate-200 bg-white/90 backdrop-blur md:hidden">
        {NAV.map(([id, label]) => (
          <button key={id} onClick={() => go(id)} className={`py-3 text-sm font-semibold transition ${view === id ? 'text-indigo-600' : 'text-slate-500'}`}>{label}</button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
